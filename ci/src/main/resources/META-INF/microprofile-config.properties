# CI config defaults, shipped from this library jar (docs/epics/qits-ci/). Library jars ship
# defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties
# is ignored — read by whichever app pulls the jar in (the `artifacts`/`epics`/`auth/*` modules ship
# their config the same way). The consuming app / env overrides any of these.
#
# ci owns its OWN named datasource + persistence unit + Flyway lineage: a separate file-based H2
# under ~/.qits/data/ci, never sharing qits' default DB or its migration history, so the future
# split into a standalone service moves files, not data (the artifacts precedent). Because it is a
# separate physical DB, ci_run.repo_id is a plain String column with NO cross-boundary FK — a
# deleted repository simply leaves runs behind as dangling history. Tests override the url to
# in-memory H2 (see src/test/resources/application.properties in this and the service module).
quarkus.datasource.ci.db-kind=h2
quarkus.datasource.ci.jdbc.url=jdbc:h2:file:${user.home}/.qits/data/ci/h2/ci;AUTO_SERVER=TRUE

# A dedicated persistence unit bound to the ci datasource, owning only this module's entities
# (the default PU keeps qits' domain entities). packages assigns entity→PU unambiguously.
quarkus.hibernate-orm.ci.datasource=ci
quarkus.hibernate-orm.ci.packages=eu.wohlben.qits.ci.entity

# Own Flyway lineage at a distinct classpath location so it never mixes with domain's db/migration.
quarkus.flyway.ci.migrate-at-start=true
quarkus.flyway.ci.baseline-on-migrate=true
quarkus.flyway.ci.locations=classpath:db/ci/migration

# ci's own working dir: per-repo bare caches for config reads live under <data-dir>/repos.
qits.ci.data-dir=${user.home}/.qits/data/ci

# The git host's smart-HTTP base as reachable by ci's OWN host-side `git` (config fetch — ci never
# touches the bare origins on disk; an extracted service has no shared filesystem). In-process this
# is qits' own port; after extraction it becomes the qits host's URL.
qits.ci.git-host-url=http://localhost:${quarkus.http.port:8080}

# The git host base as reachable FROM a step container on the shared network. Deployments on
# qits-net pin the alias (e.g. http://qits:8080 — see the devcontainer/prod compose files); the
# default works for host-run docker via --add-host=host.docker.internal:host-gateway.
qits.ci.container-git-url=http://host.docker.internal:8080

# Step containers: the docker-compatible CLI, the network they join, one conservative default
# per-step timeout (per-step config is a follow-up), and the bounded tail-truncated combined output
# kept per step. Deployments that run several stacks on one host MUST override the network together
# with qits.workspace.network (see docker-compose.prod.yml) — the alias in container-git-url only
# resolves on the network qits itself is on.
qits.ci.container-runtime=docker
qits.ci.network=qits-net
qits.ci.step-timeout-seconds=900
qits.ci.output-max-chars=65536

# A step's script is REPO-CONTROLLED code, so the container is a hostile-code sandbox: privileges
# are dropped (--cap-drop=ALL, no-new-privileges), the docker socket is never mounted, and these
# caps bound what one step can consume. See
# docs/issues/2026-07-26_ci-executes-repo-controlled-code-from-unauthenticated-pushes.md.
qits.ci.memory-limit=4g
qits.ci.pids-limit=2048
qits.ci.cpus=2

# Static token guarding the event intake (the only write surface; reads are open). Blank ⇒ the
# guard is a no-op (dev/test), exactly like qits.artifacts.token.
qits.ci.token=
