# CI config defaults, shipped from this library jar (docs/epics/qits-ci/). Library jars ship
# defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties
# is ignored — read by whichever app pulls the jar in (the `artifacts`/`epics`/`auth/*` modules ship
# their config the same way). The consuming app / env overrides any of these.
#
# ci owns its OWN named datasource + persistence unit + Flyway lineage: a separate file-based H2
# under ~/.qits/data/ci, never sharing qits' default DB or its migration history, so the future
# split into a standalone service moves files, not data (the artifacts precedent). Because it is a
# separate physical DB, ci_run.repo_id is a plain String column with NO cross-boundary FK — a
# deleted repository simply leaves runs behind as dangling history. Tests override the url to
# in-memory H2 (see src/test/resources/application.properties in this and the service module).
#
# The URL carries NO AUTO_SERVER. It used to, inherited from the monorepo, and it is the one thing
# in this context that a GraalVM native build cannot do: AUTO_SERVER makes the first opener start
# H2's own TCP server, and org.h2.server.TcpServer is not in the native image, so the binary died at
# boot with `Class "org.h2.server.TcpServer" not found` while every JVM test stayed green —
# CiPackagedSurfaceIT exists to keep that asymmetry visible. Registering the server classes was the
# alternative and it is the wrong trade: AUTO_SERVER buys a second process opening the same file,
# which a packaged single-process service does not do, and it costs a database port listening on
# every interface — on the host that also runs repo-controlled step containers.
quarkus.datasource.ci.db-kind=h2
quarkus.datasource.ci.jdbc.url=jdbc:h2:file:${user.home}/.qits/data/ci/h2/ci

# A dedicated persistence unit bound to the ci datasource, owning only this module's entities
# (the default PU keeps qits' domain entities). packages assigns entity→PU unambiguously.
quarkus.hibernate-orm.ci.datasource=ci
quarkus.hibernate-orm.ci.packages=eu.wohlben.qits.ci.entity

# Own Flyway lineage at a distinct classpath location so it never mixes with domain's db/migration.
quarkus.flyway.ci.migrate-at-start=true
quarkus.flyway.ci.baseline-on-migrate=true
quarkus.flyway.ci.locations=classpath:db/ci/migration

# ci's own working dir: per-repo bare caches for config reads live under <data-dir>/repos.
qits.ci.data-dir=${user.home}/.qits/data/ci

# Where the git host answers, as reachable by ci's OWN host-side `git` (config fetch — ci never
# touches the bare origins on disk; an extracted service has no shared filesystem). ci appends
# /git/<repoId> itself, so this value stops at the SERVICE: `git` is the codebase's second-level
# segment for the smart-HTTP wire protocol and belongs in ci's code, whereas WHICH service hosts it
# is a deployment fact and belongs here. qits-artifacts serves it under its gateway segment, so a
# fetch lands on <base>/git/<repoId> = /artifacts/git/<repoId>. Do NOT include /git in the value.
qits.ci.git-host-url=http://localhost:${quarkus.http.port:8080}/artifacts

# The same base, same shape, as reachable FROM a step container on the shared network. Deployments
# on qits-net pin the alias (e.g. http://qits-artifacts:8080/artifacts — see the devcontainer/prod
# compose files); the default works for host-run docker via
# --add-host=host.docker.internal:host-gateway.
qits.ci.container-git-url=http://host.docker.internal:8080/artifacts

# Step containers: the docker-compatible CLI, the network they join, the default per-step timeout,
# and the bounded tail-truncated combined output kept per step. Deployments that run several stacks
# on one host MUST override the network together with qits.workspace.network (see
# docker-compose.prod.yml) — the alias in container-git-url only resolves on the network qits itself
# is on.
#
# step-timeout-seconds is the DEFAULT deadline, not the only one: a pipeline may declare
# `timeout-seconds:` per step, and this is what a step that declares none gets. It is enforced INSIDE
# the container by the step's own daemon, which signals its child and reports the timeout as a
# timeout rather than as a suspicious exit code.
#
# The grace is how much longer the host waits before concluding the daemon is not going to answer at
# all. It sits behind the in-container deadline on purpose — the daemon enforcing its own child is
# the normal path and this backstop should never fire — and it has to cover the daemon's SIGTERM,
# its 5s grace, the SIGKILL, and one frame's flight. When it does fire the host sends a Cancel and
# then removes the container, and the step is recorded timed out.
#
# output-max-chars bounds BOTH the live relay and the persisted tail — one budget, applied as text
# arrives rather than to an assembled string. A step's output is repo-controlled and unbounded, so
# this is a security property, not a display preference.
qits.ci.container-runtime=docker
qits.ci.network=qits-net
qits.ci.step-timeout-seconds=900
qits.ci.step-timeout-grace-seconds=60
qits.ci.output-max-chars=65536

# A step's script is REPO-CONTROLLED code, so the container is a hostile-code sandbox: privileges
# are dropped (--cap-drop=ALL, no-new-privileges), the docker socket is never mounted, and these
# caps bound what one step can consume. See
# docs/issues/2026-07-26_ci-executes-repo-controlled-code-from-unauthenticated-pushes.md.
qits.ci.memory-limit=4g
qits.ci.pids-limit=2048
qits.ci.cpus=2

# Static token guarding the event intake (the only write surface; reads are open). Blank ⇒ the
# guard is a no-op (dev/test), exactly like qits.artifacts.token.
qits.ci.token=

# --- the ci-daemon (eu.wohlben.qits.ci.daemonhost, in the service module) ------------------------
# A step container no longer runs a script under `docker run`: it runs qits-ci-daemon, which dials
# BACK to qits-ci over a websocket and receives the step as the reply to its own "initialized". The
# keys below are that arrangement's whole configuration. They are shipped from this jar with the
# other qits.ci.* defaults even though the code reading them lives in `service` — a deployment sets
# qits.ci.* in one place and does not care which module reads which.
#
# THE VERSION AND THE URL MOVE TOGETHER, which is why the url is a template rather than a second
# free value. The version is resolved once per run and injected into every one of that run's step
# containers, so a deploy landing mid-run cannot make step 3 speak a different protocol than step 1.
#
# {version} is the binary's SHA256, not a version number, because the shipped url is qits-artifacts'
# OCI blob route — `GET /v2/<name>/blobs/sha256:<hex>` needs no manifest, no tag and no
# authentication (reads there are anonymous, always), and the registry re-verified the digest when
# the blob was uploaded. So the version pin and the integrity pin are the same field and no separate
# checksum travels beside it. The cost is that a run row records a digest rather than a readable
# version; a version-addressed surface in qits-artifacts would be a config edit here, not a code
# change. Publishing is one request:
#   curl -u qits:$TOKEN --data-binary @qits-ci-daemon \
#     -X POST 'http://<host>/v2/qits/ci-daemon/blobs/uploads/?digest=sha256:<hex>'
# (the `qits` repository row must exist as oci-images; the artifacts seeder does not create it).
#
# Blank is the default because this repo has no binary to point at and any digest it invented would
# be a lie. A blank version yields a url that 404s, which surfaces as the never-registered failure
# state with the bootstrap's own error text captured from `docker logs` — an honest failure rather
# than a silent one. A deployment sets it together with the daemon it deployed.
qits.ci.daemon-version=
qits.ci.daemon-binary-url-template=http://qits-artifacts:8080/v2/qits/ci-daemon/blobs/sha256:{version}

# Where the daemon dials, TOLD and never derived: the container receives this string verbatim as
# $QITS_CI_DAEMON_URL and parses nothing out of it. It is qits-ci's own route on the shared network
# at qits-ci's own port — NOT a gateway route, because one process per container with a lifetime of
# one step has no stable address worth configuring. The /ci segment is in the value because a
# @WebSocket path is a literal that does not follow quarkus.rest.path. Deployments not on qits-net
# override it (host-run docker wants ws://host.docker.internal:8080/ci/daemon).
qits.ci.container-daemon-url=ws://qits-ci:8080/ci/daemon

# The two lifecycle deadlines the host parks on, each covering a different thing so a hang is
# attributable: register covers the image pull plus the daemon download (a cold image on a slow link
# is the worst case), initialize covers the daemon's own shallow clone and checkout. Both are
# backstops — nothing about a healthy run waits anywhere near them — and neither is the step's
# timeout, which is qits.ci.step-timeout-seconds and enforced inside the container.
qits.ci.daemon-register-timeout-seconds=60
qits.ci.daemon-init-timeout-seconds=120
