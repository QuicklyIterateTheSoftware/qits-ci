# CI config defaults, shipped from this library jar (docs/epics/qits-ci/). Library jars ship
# defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties
# is ignored — read by whichever app pulls the jar in (the `artifacts`/`epics`/`auth/*` modules ship
# their config the same way). The consuming app / env overrides any of these.
#
# ci owns its OWN named datasource + persistence unit + Flyway lineage: its own postgres database,
# never sharing another context's DB or its migration history, so the split into a standalone
# service moved files, not data (the artifacts precedent). Because it is a separate physical DB,
# ci_run.repo_id is a plain String column with NO cross-boundary FK — a deleted repository simply
# leaves runs behind as dangling history. The suites point the same three keys at an embedded
# postgres (EmbeddedPgConfigSource, in this module's and the service module's test sources).
#
# THE THREE KEYS BELOW ARE THE PLATFORM'S GENERIC RESOURCE CONTRACT, read back by the jar that needs
# it. This repository declares `resources: postgresql:db` in .config/qits/deployments.yml;
# qits-platform-deployments creates the role and the database before the cutover and injects
# QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD into the container it starts. Nothing in the deployer
# is ci-specific — an application maps the generic variables in its own shipped defaults, and this
# file is where this context does it. The variable names follow the resource NAME, so renaming the
# resource in the spec stops matching this file: the name is `db`.
#
# THE TRIPLE HAS NO DEFAULTS AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming what is missing,
# rather than opening some fallback store nobody meant.
#
# That stance is what finally closes this context's oldest failure family, and both halves of it were
# the ${user.home} H2 file. AUTO_SERVER on that URL broke the native binary alone — org.h2.server.
# TcpServer is not in the image — with every JVM test green; and UID 1001 in the runtime image has no
# passwd entry, so ${user.home} resolved to `?` and the container refused to boot on a path. A
# default with no feature in it cannot lose one. What replaced it is a value a deployment supplies or
# does not, and CiPackagedSurfaceIT still puts the SHIPPED expression itself under test by handing
# the launched artifact the variables rather than the datasource keys.
quarkus.datasource.ci.db-kind=postgresql
quarkus.datasource.ci.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.ci.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.ci.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER, WHICH STOCK AGROAL DOES NOT. Replacing the tier's postgres
# severs every pooled connection; without validation the pool hands a dead one to the next caller
# long after the database is back, and 5s of acquisition is not enough for the successor to take the
# alias. Validate at borrow, and wait 15s before giving up.
#
# THREE LINES, AND ALL THREE OR NONE — the platform's datasource baseline, asserted by
# DatasourceBaselineTest and written down in docs/project-setup-quinoa-angular.md with the
# measurements behind it. PatientPgDriver (qits-db-core) delegates to org.postgresql.Driver and,
# when the database is not there, keeps asking for up to 14s rather than failing at once — SQLState
# 08* and 57P03 only, so a wrong password still fails on the first attempt. Its deadline sits UNDER
# the acquisition timeout, so a caller that outlasts it gets the database's real refusal instead of
# a generic pool message; and validate-on-borrow is what turns a dead pooled connection into the
# fresh creation attempt the driver makes patient. Each line does less than it reads as without the
# other two. The url stays a plain jdbc:postgresql: one, so the QITS_RESOURCE_DB_* contract above is
# untouched.
quarkus.datasource.ci.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.ci.jdbc.acquisition-timeout=15S
quarkus.datasource.ci.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to the ci datasource, owning only this module's entities
# (the default PU keeps qits' domain entities). packages assigns entity→PU unambiguously.
quarkus.hibernate-orm.ci.datasource=ci
quarkus.hibernate-orm.ci.packages=eu.wohlben.qits.ci.entity

# Own Flyway lineage at a distinct classpath location so it never mixes with the other lineage this
# application boots (the eventstream outbox's). ONE location and ONE V1: the move to postgres is a
# clean start, so the nine H2 migrations are history in this repository's log rather than a prefix of
# this lineage — see V1__init.sql's header.
#
# The SECOND location is gone with them. It named the java package holding
# V9__drop_generated_check_constraints, a migration that existed only to remove constraints H2 had
# named itself; a fresh schema simply does not create them. Nothing restates this list in a test
# resources file — a second copy is a copy that drifts.
#
# baseline-on-migrate is GONE with that lineage. It told Flyway to adopt a non-empty schema it had
# no history table for, which the H2 file needed while it was being adopted; every database this code
# now meets is empty or was created by this very lineage, and the flag would only mask the one case
# worth failing on — a schema somebody else put there.
quarkus.flyway.ci.migrate-at-start=true
quarkus.flyway.ci.locations=classpath:db/ci/migration

# Where the git host answers. ci reads a repository's pipeline config off this host's content
# endpoints — <base>/git/<repoId>/blob/<rev>/<path> and .../tree/<rev>[/<path>] — so it needs no
# clone, no local mirror and no git binary. ci appends /git/<repoId> itself, so this value stops at
# the SERVICE: `git` is the codebase's second-level segment for the git host and belongs in ci's
# code, whereas WHICH service hosts it is a deployment fact and belongs here. Do NOT include /git.
#
# THE HOST IS qits-githost NOW, and the value lost a path segment with the move. The git host used
# to live inside qits-artifacts and answer under that service's gateway segment, so the base was
# `http://<host>:<port>/artifacts` and a read landed on /artifacts/git/<repoId>. Standing alone it
# serves /git/** at the ROOT — GitHostRoutes' BASE is the literal `/git` and no config key moves it
# — so the base is scheme+host+port and nothing else, and a read lands on /git/<repoId>. A value
# that keeps the old segment 404s every read, which surfaces as "no pipeline" on every push rather
# than as an error: this is a cutover both services make in one step.
qits.ci.git-host-url=http://qits-githost:8080

# The same base, same shape, as reachable FROM a step container on the shared network. Deployments
# on qits-net use the alias as it stands; a host-run docker daemon wants
# http://host.docker.internal:8080 with --add-host=host.docker.internal:host-gateway.
qits.ci.container-git-url=http://qits-githost:8080

# Step containers: the docker-compatible CLI, the network they join, the number of builds admitted
# in parallel, the default per-step timeout, and the bounded tail-truncated combined output kept per
# step. Deployments that run several stacks
# on one host MUST override the network together with qits.workspace.network (see
# docker-compose.prod.yml) — the alias in container-git-url only resolves on the network qits itself
# is on.
#
# step-timeout-seconds is the DEFAULT deadline, not the only one: a pipeline may declare
# `timeout-seconds:` per step, and this is what a step that declares none gets. It is enforced INSIDE
# the container by the step's own daemon, which signals its child and reports the timeout as a
# timeout rather than as a suspicious exit code.
#
# The grace is how much longer the host waits before concluding the daemon is not going to answer at
# all. It sits behind the in-container deadline on purpose — the daemon enforcing its own child is
# the normal path and this backstop should never fire — and it has to cover the daemon's SIGTERM,
# its 5s grace, the SIGKILL, and one frame's flight. When it does fire the host sends a Cancel and
# then removes the container, and the step is recorded timed out.
#
# output-max-chars bounds BOTH the live relay and the persisted tail — one budget, applied as text
# arrives rather than to an assembled string. A step's output is repo-controlled and unbounded, so
# this is a security property, not a display preference.
#
# concurrent-builds is an instance-wide bound on RUNNING pipelines. Each pipeline still executes
# its own steps sequentially, but independent runs no longer wait behind one slow build. It must be
# at least 1; size it together with the host resources and the per-container caps below.
qits.ci.container-runtime=docker
qits.ci.network=qits-net
qits.ci.concurrent-builds=4
qits.ci.step-timeout-seconds=900
qits.ci.step-timeout-grace-seconds=60
qits.ci.output-max-chars=65536

# How long POST /ci/api/events/trigger keeps asking repositories. That call evaluates on the request
# thread — a caller-supplied event is redeliverable by nobody, so it may not be handed to a queue —
# and each candidate costs one read of the git host. The deadline is what stops an unanswering host
# from holding the caller for candidates times that read timeout; the repositories not asked come
# back in the answer as skipped, so the caller sees a partial answer as partial.
qits.ci.trigger-deadline-seconds=60

# A step's script is REPO-CONTROLLED code, so the container is a hostile-code sandbox: privileges
# are dropped (--cap-drop=ALL, no-new-privileges), no docker socket is mounted unless the step
# declared `docker: true`, and these caps bound what one step can consume. See
# docs/issues/2026-07-26_ci-executes-repo-controlled-code-from-unauthenticated-pushes.md.
qits.ci.memory-limit=4g
qits.ci.pids-limit=2048
qits.ci.cpus=2

# Where the host's docker daemon listens, for the ONE thing a pipeline can ask for: a step declaring
# `docker: true` gets this path bind-mounted into its container at the same path, so the docker CLI in
# the step image finds it where it looks by default. That is how a pipeline publishes an image — a
# final step whose script is `docker build && docker push` — and it is deliberately a config key
# rather than a constant, because a rootless daemon under $XDG_RUNTIME_DIR or a socket-activated proxy
# is a deployment fact.
#
# Such a step is ROOT-EQUIVALENT ON THE HOST: the socket is the daemon and the daemon is root, so the
# step can mount host paths and start privileged containers regardless of the cap-drop flags, which
# fence its own process tree and not what the daemon does on its behalf. It is accepted for the POC
# under the standing posture (sources are trusted), and it is opt-in per step and visible in the
# repository's config diff. Every step that does not declare the flag keeps exactly the sandbox above.
qits.ci.docker-socket-path=/var/run/docker.sock

# qits-platform-artifacts' registry coordinates, injected into EVERY step container as
# $QITS_REGISTRY and $QITS_IMAGE_REPOSITORY so a publish script names no deployment fact of its own.
# With $QITS_CI_SHA they spell the whole tag convention qits-cd pulls by:
#   <registry>/<repository>/<application>:<sha>
# where <application> is the environment's application name, by convention the repository's name.
#
# RECEIVER-NAMED, not qits.ci.*: these are qits-platform-artifacts' own coordinates, and there is
# ONE spelling of them in the platform — qits-cd ships the same two keys and derives its pull
# references from them. A deployment that moves the registry edits one pair of values in both
# services, not two differently-named pairs.
#
# The address is dialled by the HOST'S DOCKER DAEMON, not by this process and not even by the step's
# CLI: the CLI on the far side of the mounted socket is a client, and the daemon is what performs the
# build and the push and therefore what resolves the name and negotiates TLS. So a deployment must
# make this address resolvable FROM THE DOCKER HOST and add it to the daemon's insecure-registries
# while the registry speaks plain HTTP — the same class of fact as the socket mount above, now served
# by the same socket.
qits.artifacts.registry-host=qits-platform-artifacts:8080
qits.artifacts.image-repository=qits

# qits-platform-artifacts' npm registry roots, injected into EVERY step container as
# $QITS_NPM_REGISTRY_URL (the hosted repository, where @qits/* packages are published) and
# $QITS_NPM_PROXY_URL (the pull-through cache of npmjs, which every install resolves through). A
# step writes its own ~/.npmrc from the two — see the preamble in README.md — so no repository ever
# spells a registry address.
#
# RECEIVER-NAMED and one spelling, for the same reason as the two keys above: they are the artifacts
# service's own addresses, not ci's opinion about them.
#
# THE CAVEAT IS THE OPPOSITE OF registry-host'S. These are dialled by the STEP CONTAINER ITSELF over
# qits-net — plain HTTP from the npm CLI to a service alias, no socket, no host daemon in the path.
# So the defaults are the in-network alias and they are RIGHT for a deployment on qits-net, and a
# host-published mapping (the local stack's localhost:8081) must NOT be substituted here the way it
# must for registry-host: a step container has no localhost:8081. Only a deployment that moves
# qits-platform-artifacts off the alias overrides these.
qits.artifacts.npm.hosted-url=http://qits-platform-artifacts:8080/artifacts/npm/npm/
qits.artifacts.npm.proxy-url=http://qits-platform-artifacts:8080/artifacts/npm/npmjs/

# qits-platform-artifacts' hosted Maven repository, injected into EVERY step container as
# $QITS_MAVEN_REGISTRY_URL. Like the npm roots above, it is dialled by the step container itself
# over qits-net, so the in-network service alias is correct and a host-published localhost mapping
# is not. A release pipeline passes this value to Maven as its deployment repository; consumers use
# the same root to resolve the SoftwareRelease coordinate they were told about.
qits.artifacts.maven.registry-url=http://qits-platform-artifacts:8080/artifacts/maven/maven

# qits-platform-artifacts' docs repository root, injected into EVERY step container as
# $QITS_DOCS_URL. The npm and maven reading again — dialled by the step container itself over
# qits-net, so the in-network alias is right and a host-published localhost mapping is not.
#
# It includes the `docs` repository segment, unlike registry-host and like the npm and maven roots,
# because there is exactly one docs namespace and a pipeline choosing one would be a pipeline able
# to publish into a namespace nobody seeded. A step appends `/<site>/-/<version>` and nothing else.
qits.artifacts.docs.url=http://qits-platform-artifacts:8080/artifacts/docs/docs

# qits-workspaces' root, injected into EVERY step container as $QITS_WORKSPACES_URL. A step that
# releases its own repository after green tests — the release train's maintenance leg — POSTs to it,
# and must spell no deployment fact of its own.
#
# Dialled by the STEP CONTAINER ITSELF over qits-net, so the caveat is the npm pair's and not
# registry-host's: the in-network alias is the value that is RIGHT here, and a host-published
# mapping must not be substituted for it. The scheme+host+port shape is the platform's; the path
# belongs to the caller, which spells /workspaces/api/... itself.
#
# qits.ci.* rather than receiver-named because ci is the only service that ships it: the two
# receiver-named pairs above are spelled identically by qits-cd, and a key with one reader is a key
# with one name.
qits.ci.workspaces-url=http://qits-workspaces:8080

# --- the ci-daemon (eu.wohlben.qits.ci.daemonhost, in the service module) ------------------------
# A step container no longer runs a script under `docker run`: it runs qits-ci-daemon, which dials
# BACK to qits-ci over a websocket and receives the step as the reply to its own "initialized". The
# keys below are that arrangement's whole configuration. They are shipped from this jar with the
# other qits.ci.* defaults even though the code reading them lives in `service` (and, for the pin
# itself, in `ci/control/CiDaemonPins`) — a deployment sets qits.ci.* in one place and does not care
# which module reads which.
#
# THE VERSION AND THE URL MOVE TOGETHER, which is why the url is a template rather than a second
# free value. The version is resolved once per run (through the pin LADDER, not this key alone —
# see CiDaemonPins) and injected into every one of that run's step containers, so a deploy landing
# mid-run cannot make step 3 speak a different protocol than step 1.
#
# {version} IS A VERSION, not a digest — a calver like `2026.803.91607`, or the sha256 hex of a
# binary this store has no calver row for yet (a freshly bootstrapped platform's own daemon, still
# published that way). The address is qits-platform-artifacts' version-addressed daemon route,
# `GET /artifacts/daemons/<name>/<version>`, which resolves through that store's own
# `daemon_binary(repository, name, version)` row rather than through an OCI blob digest. A version is
# the software's coordinate; needing a digest to name a release would mean the artifact model was
# wrong (ci-daemon-autoadopt-plan.md). What stands in for the old digest-as-integrity-pin is
# immutability instead: a PUT of an existing version is 409 inside qits-platform-artifacts' publish
# transaction, so a version pointer here can never come to mean different bytes. The response still
# echoes `Docker-Content-Digest` for a caller that wants to verify, but nothing in this pin requires
# it to.
#
# The OLD digest-addressed template (`.../v2/qits/ci-daemon/blobs/sha256:{version}`) still works —
# the OCI blob route is untouched — so a deployment can put it back with this same one config edit,
# and its own boot-time shape check is gone with it: CiIdentifiers.requireDaemonVersion now enforces
# the single-path-segment shape (a calver or a digest hex, never `/`, `..`, `?`, `#` or whitespace) at
# ADOPTION, where a version now actually arrives untrusted, rather than warning about the configured
# value at boot.
#
# Publishing a calver is one request against the version-addressed route:
#   curl -u qits:$TOKEN --data-binary @qits-ci-daemon \
#     -X PUT 'http://<host>/artifacts/daemons/qits-ci-daemon/<calver>'
#
# Blank is the default because this repo has no binary to point at and any version it invented would
# be a lie. A blank version yields a url that 404s, which surfaces as the never-registered failure
# state with the bootstrap's own error text captured from `docker logs` — an honest failure rather
# than a silent one. It is also the LADDER's bottom rung and never demoted: an adopted candidate that
# proves itself outranks it, but nothing ever removes it, which is what makes a deployment's own
# choice the one a rollback can always fall back to.
qits.ci.daemon-version=
qits.ci.daemon-binary-url-template=http://qits-platform-artifacts:8080/artifacts/daemons/qits-ci-daemon/{version}

# Whether this instance discovers and adopts qits-ci-daemon releases off the SoftwareRelease bus at
# all (ci-daemon-autoadopt-plan.md §2.9). Shipped true: a deployment adopts by default. The startup
# discovery this key guards is a plain HTTP call to qits.events.url and is NOT covered by
# qits.eventstream.enabled — that key only stops the bus half — so it needs a switch of its own, and
# service/src/main/resources/application.properties sets it false under %dev/%test for the same
# reason that file darkens the bus: a clone-alone build and a @QuarkusTest have no qits-events to
# dial.
qits.ci.daemon-autoadopt-enabled=true

# The image a candidate's probe container runs (ci-daemon-autoadopt-plan.md §2.3, workstream BW):
# mint credentials, launch, wait for the dial, read the reported capability version, reap -- no
# step ever reaches it. alpine:3 is the default because it is small and carries the whole
# CiDaemonLauncher.BOOTSTRAP contract (/bin/sh, and busybox wget). A platform that cannot pull it
# never adopts and keeps its configured pin -- see DaemonProbe.Verdict.UNKNOWN.
qits.ci.daemon-probe-image=alpine:3

# Where the daemon dials, TOLD and never derived: the container receives this string verbatim as
# $QITS_CI_DAEMON_URL and parses nothing out of it. It is qits-ci's own route on the shared network
# at qits-ci's own port — NOT a gateway route, because one process per container with a lifetime of
# one step has no stable address worth configuring. The /ci segment is in the value because a
# @WebSocket path is a literal that does not follow quarkus.rest.path. Deployments not on qits-net
# override it (host-run docker wants ws://host.docker.internal:8080/ci/daemon).
qits.ci.container-daemon-url=ws://qits-ci:8080/ci/daemon

# The two lifecycle deadlines the host parks on, each covering a different thing so a hang is
# attributable: register covers the image pull plus the daemon download (a cold image on a slow link
# is the worst case), initialize covers the daemon's own shallow clone and checkout. Both are
# backstops — nothing about a healthy run waits anywhere near them — and neither is the step's
# timeout, which is qits.ci.step-timeout-seconds and enforced inside the container.
qits.ci.daemon-register-timeout-seconds=60
qits.ci.daemon-init-timeout-seconds=120
