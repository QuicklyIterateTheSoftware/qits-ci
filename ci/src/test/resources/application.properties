# The ci suite runs against an EMBEDDED POSTGRES — real binaries, spawned as a child process by
# zonky, never a container, because a clone of this repo tests green with no docker. Its port is
# chosen at run time, so url/username/password are not written here at all: EmbeddedPgConfigSource
# supplies them at an ordinal above this file, and the db-kind comes from this module's own shipped
# defaults. What is left here is what a file can say. clean-at-start wipes the schema between Quarkus
# restarts, which is what keeps a suite sharing one database across classes reproducible.
quarkus.flyway.ci.clean-at-start=true
# No `locations` here. The list is shipped in this module's META-INF/microprofile-config.properties;
# a copy would have to be kept in step, and a suite migrating a different lineage than the deployment
# is exactly the lie this file's rule exists to prevent.

# NO DEV SERVICES. A dev service is a container start, and a datasource whose url arrives from a
# config source rather than a file is exactly the shape that invites one if anything ever goes wrong
# with that source. This says no once, out loud, instead of leaving it to luck.
quarkus.devservices.enabled=false

# This module registers no route of its own and pulls in no HTTP stack, so the key costs nothing
# today. It is here because the default test port is 8081, which on the deployment host is the
# address the platform's own npm registry answers on — this repo's known flake (AGENTS.md) — and the
# day a dependency drags a server in, the whole suite would die with "Port already bound" for a
# reason that has nothing to do with the code. 0 takes a free one.
quarkus.http.test-port=0

# Queue/race tests deliberately occupy the sole worker to make QUEUED observable deterministically.
qits.ci.concurrent-builds=1

# The eventstream jar rides in with CausedRow (CiRun's causation column), and this module's suite
# owes it the same two facts the service module's owes: darkness — no publish, no sweep, no dial —
# and a database, which EmbeddedPgConfigSource supplies beside ci's own. clean-at-start for the
# same reproducibility the ci datasource gets; no catch-up at startup, so nothing consumes behind a
# test's back.
qits.eventstream.enabled=false
qits.eventstream.catchup-at-startup=false
quarkus.flyway.eventstream.clean-at-start=true

# The read seams' patience deadline (CiRunService's listings, CiDaemonPins.currentAnswer,
# KnownCiRepos.candidates). The shipped default is 15S — a postgres cutover's worth — and a test that
# proves the give-up would otherwise wait out the whole of it. Test-only by construction: the value
# ships as the @ConfigProperty default, so there is no app-level line here being shadowed.
qits.ci.db-retry-deadline=PT0.3S

# Platform pipelines OFF by default in this suite, and armed per test through
# CiEventTriggerService#platformPipelinesRepository. The shipped default names the wrapper, which no
# fake catalogue here holds — so leaving it on would cost every unrelated event a WARN about a
# repository the suite was never going to have.
qits.ci.platform-pipelines-repository=

# NOTHING SWEEPS THE OWED-EVENT LEDGER BEHIND A TEST. The trigger engine records every accepted event
# in ci_owed_event and re-evaluates what a dead process left there — at boot (skipped under TEST) and
# on this schedule. Stretched rather than switched off, exactly as the service suite stretches the
# eventstream catch-up: a tick landing mid-test would fan out at a fake git host for an event the test
# is still arranging, and CiEventTriggerServiceTest drives sweepOwed() itself for the cases that want
# one. The grace stays shipped-shaped, so a row a test writes with a stale accepted_at is what the
# sweep picks up rather than one it wrote a moment ago.
qits.ci.trigger-owed-sweep-interval=24h
