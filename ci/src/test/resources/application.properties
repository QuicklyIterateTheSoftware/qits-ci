# The ci suite runs against in-memory H2 (no docker), overriding the file-H2 default shipped in
# this jar's META-INF/microprofile-config.properties. clean-at-start wipes between runs.
quarkus.datasource.ci.db-kind=h2
quarkus.datasource.ci.jdbc.url=jdbc:h2:mem:ci;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.ci.datasource=ci
quarkus.hibernate-orm.ci.packages=eu.wohlben.qits.ci.entity
quarkus.flyway.ci.migrate-at-start=true
quarkus.flyway.ci.clean-at-start=true
quarkus.flyway.ci.locations=classpath:db/ci/migration
qits.ci.data-dir=target/ci-test-data
