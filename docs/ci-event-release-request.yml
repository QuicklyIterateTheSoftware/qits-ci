# THE REFERENCE QA PIPELINE — one file per repository, and the only pipeline a repository has.
#
# This is a TEMPLATE, not a live trigger. It lives in docs/ because a file under `.config/qits/` is
# a pipeline qits-ci runs; the rollout sweep is what stamps a copy of this into every repository's
# `.config/qits/ci-event-release-request.yml`, replacing that repository's `ci-event-build.yml` and
# `ci-event-userflows.yml`. Three things are per-repository and are marked <LIKE THIS> below: the
# repository name in `when:`, the image and the script of the gating step, and the image and script
# of the non-gating one. Everything else is the shape and does not vary.
#
# ---------------------------------------------------------------------------------------------
# WHY THE EVENT, AND WHY IT IS THE ONLY ONE
#
# The platform runs NO CI OUTSIDE RELEASE REQUESTS. qits-projects maintains, per open release
# request, a backing branch `release/<id>` — an octopus merge of the request's N sources, refolded
# whenever the set changes — and publishes `ReleaseRequestChanged` on every successful re-fold. That
# branch is written by qits-githost's merge primitive, which deliberately fires no `post-receive`
# and therefore publishes no `SCMPublishCommit`: without this event the fold exists and NOTHING
# BUILDS IT. A fold the git host answered `unchanged`, and one that conflicted, publish nothing —
# so every arrival here is a new sha worth a build.
#
# The verdict returns on the ordinary `BuildSuccessful` / `BuildFailed`, with `commitSha` = the
# `mergedSha` this run received, which is what qits-projects' `BuildStatusListener` matches on
# together with `repoId`. It reads `gating` off the same payload; see the two halves below.
#
# ---------------------------------------------------------------------------------------------
# DECIDE AT MAIN, BUILD AT THE FOLD
#
# `checkout:` names two dot-paths into the payload, and the pair is mandatory — a sha with no branch
# whose history holds it is not something a step container can fetch. The trigger file itself is
# DISCOVERED, PARSED AND SELECTED at `main`'s head, always; only the recorded run's branch and sha
# come from the payload. So a release request cannot alter the CI that gates it by folding in a
# commit that edits this file. The two payload values are validated before they reach a clone URL.
#
# The run row records `release_request_id` besides them. That is deliberate and it is the handle the
# request is addressed by: `mergedSha` identifies ONE fold and the next re-fold replaces it, so it
# is not something a cancellation or a retry can hold on to.
#
# ---------------------------------------------------------------------------------------------
# ONE FILE, TWO HALVES — AND "A RED VERIFY MUST NOT COST THE IMAGE" STILL HOLDS
#
# The two-file split (`ci-event-build.yml` gating, `ci-event-userflows.yml` non-gating) existed
# because two files cannot share a verdict. One file buys the same property with ORDERING plus
# PER-STEP CLASSIFICATION:
#
#   * steps run in order and the gating half is FIRST, so whatever it publishes is published before
#     a non-gating step can fail;
#   * a step declaring `gating: false` still fails the run — the row is red and a person sees it —
#     but the build event carries `gating: false`, so the release request's build gate does not hold
#     the fold for it.
#
# The run's announced `gating` is the FILE's flag ANDed with the failing step's own. A green run is
# worth what the file says. A `gating: false` file stays non-gating however its steps are declared.
#
# Keep the non-gating steps LAST. A non-gating step that fails stops the run exactly as any failing
# step always has, so anything after it is SKIPPED — which is fine for a publish and wrong for a
# build.
#
# ---------------------------------------------------------------------------------------------
# LOOP REVIEW
#
# This pipeline publishes a docs bundle and pushes no commit and no tag, so it changes nothing the
# fold is made of and cannot re-trigger itself. A repository whose gating half publishes an IMAGE
# per fold is publishing under the merged sha, which no `ReleaseRequestChanged` is derived from.
# Publish-if-absent everywhere: events redeliver and published versions are immutable, so 409 is
# success.

event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's storage coordinate is an opaque UUID since the identity
  # cutover, so a name match on repoId is not dependable. The event echoes the public name; a rename
  # updates this line in the same campaign.
  - repoName: { exact: <THIS REPOSITORY'S NAME> }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  # --- the GATING half: build and test the fold -------------------------------------------------
  # Whatever this half publishes, it publishes before anything below can fail. A red here IS a
  # verdict about the fold and the release request's build gate holds on it.
  - image: <THE REPOSITORY'S BUILD IMAGE>
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed build is swallowed
      # and the run reports SUCCESS. -u is load-bearing too: an unset registry variable must stop
      # the step rather than quietly resolve against the wrong registry.
      set -eu

      # $QITS_CI_BRANCH is release/<id> and $QITS_CI_SHA is the merged sha — the fold is already
      # checked out, so nothing here fetches or switches refs.
      <THE REPOSITORY'S BUILD AND TEST COMMANDS>

  # --- the NON-GATING half: publish what the run observed ---------------------------------------
  # `gating: false` is the whole of the old second file. This step failing leaves the run FAILED and
  # visible, and leaves the fold's build gate untouched.
  - image: <THE REPOSITORY'S BUILD IMAGE>
    gating: false
    timeout-seconds: 1200
    script: |
      set -eu

      # Version the bundle by the merged sha, so a bundle URL never changes meaning, and carry the
      # branch as discovery metadata. Publish-if-absent: 409 is success.
      tar -czf userstories.tgz -C <THE REPOSITORY'S USERFLOW OUTPUT DIRECTORY> .
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: <THIS REPOSITORY'S NAME>" \
        "$QITS_DOCS_URL/@userflows/<THIS REPOSITORY'S NAME>/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for $QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for $QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
