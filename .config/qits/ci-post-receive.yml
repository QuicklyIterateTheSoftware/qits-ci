# The pipeline qits-ci runs on every push to a tracked branch of this repository — which is this
# repository, so a green run here ends by replacing the process that ran it.
#
# One step, two halves, and the split between them is the whole point:
#
#   1. build the ci client (service/src/main/webui = the qits-spa-ci submodule) HERE, in the step
#      container, which sits on qits-net and can therefore reach the platform's own npm registry —
#      where @qits/ui-components lives and where nothing else can reach it from;
#   2. build this repo's docker/Dockerfile, whose builder stage packages that already-built bundle
#      and never runs an install.
#
# THE DOCKER FLAGS on half two. The builder stage resolves jars published only to the platform's own
# Maven repository, so it has to reach it — and, once those reads are gated, authenticate to it:
#
#   --network host        NOT a custom network: buildkit — the builder format the platform targets,
#                         because a swarm cannot assume the legacy builder — refuses custom networks
#                         on a build. Host networking is buildkit-supported and reaches the
#                         registry's host-published address.
#   --build-arg           names that address, derived from the same injected env the image tag uses,
#                         so no address is stated here. The Dockerfile turns it into
#                         -Dqits.maven.repository.url, which the pom's `qits-maven` repository reads
#                         and .qits-maven-settings.xml mirrors.
#   --secret (twice)      the run's commissioned idp client, reaching ONE `RUN`'s environment and no
#                         layer — which is why it is not a third build arg. See the Dockerfile.
#
# Half one stays out of the image build anyway: the client's install is the step container's job,
# where the lockfile origin swap and the `npm_config_*` environment already live. That is why this
# step's image is node-docker-base rather than ci-base — it needs node, npm and git for half one and
# the docker CLI for half two. The same split, for the
# same reason, as qits-gateway's pipeline and every webui-carrying sibling's — they should keep
# matching.
#
# Half two publishes under the tag that is the whole contract with qits-deployments —
# <registry>/<repository>/<this repo's name>:<sha>. The step's own container only drives the docker
# CLI; the build and the push happen in the host's daemon through the socket this step declares
# (docker: true). A failed push is a failed step is a FAILED run.
steps:
  - image: qits/build-images/node-docker-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed docker build is
      # swallowed: the push fails, `docker rmi || true` answers 0, the run reports SUCCESS, and cd
      # is told an image exists that does not (the exact shape of the qits-workspaces
      # IMAGE_MISSING incident). -u is load-bearing too: an unset registry variable must stop the
      # step, not quietly resolve the @qits scope against npmjs.org, where those packages do not
      # exist and never will.
      set -eu

      # The daemon's clone does not recurse, so initialise the Angular client explicitly.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-spa-ci"
      git -c submodule.qits-spa-ci.url="$frontend_url" submodule update --init service/src/main/webui

      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative. Same problem
      # and same fix as qits-spa-ci's own pipeline — that repo's recipe is where this pattern is
      # maintained, and the two should keep matching.
      #
      # npm pins a full resolved URL per package, and qits-spa-ci's lockfile is generated on the
      # deployment host, so every entry names a localhost port — an address that does not exist in
      # this container. `npm ci` fetches tarballs by that URL and never asks the configured registry
      # for them, so the environment below does not reach them: without this swap the install dies
      # on connection refused. The paths are identical on every address, so replacing the ORIGIN and
      # keeping the path is all it takes, and the integrity hashes are what make that safe — bytes
      # from the other address must still hash the same. The checkout is this step's own; nothing is
      # edited that anyone will ever read again.
      #
      # THE BYTE PLANE IS TWO SERVICES SINCE THE SPLIT, WHICH IS WHY THE SWAP READS THE PATH.
      # qits-platform-mirror holds the npmjs pull-through cache; qits-artifacts hosts the @qits
      # scope. No single origin serves both, so the path is what tells them apart: an entry under
      # the hosted registry's own pathname — $QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/ — is a
      # @qits tarball and gets the hosted origin, and every other entry gets the proxy's. One sed
      # covered both roots while they shared an origin; since the split it sends every @qits tarball
      # to the mirror, which has never held one: 404, on every run.
      #
      # THE ORDER OF THE TWO EXPRESSIONS IS THE WHOLE TRICK. sed applies -e in sequence per line, so
      # the broad proxy swap runs FIRST and the narrow path-anchored one corrects the @qits entries
      # after it. The other order lets the broad expression undo the narrow one.
      #
      # npm's own knob for exactly this, `--replace-registry-host=always`, cannot do it against a
      # registry mounted under a path, and could not have told two registries apart either.
      # @npmcli/arborist glues rather than resolves (reify.js:
      # `registry.slice(0, -1) + resolvedURL.pathname`), so
      # http://qits-platform-mirror:8080/artifacts/npm/npmjs/ + /artifacts/npm/npmjs/zone.js/-/…tgz
      # comes out as …/artifacts/npm/npmjs/artifacts/npm/npmjs/zone.js/-/…tgz and every tarball
      # 404s. Measured on npm 10.9.4.
      #
      # Every address is derived from the injected env rather than spelled here: no repository
      # states a deployment's addresses, and the two qits-spa-ci does state (in its .npmrc, for a
      # developer on the host: registry.dev.localhost:8080 for the @qits scope and
      # mirror.dev.localhost:8080 for npmjs) are the ones being replaced.
      cd service/src/main/webui
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file. qits-spa-ci COMMITS an .npmrc (registry.dev.localhost:8080 for
      # @qits and mirror.dev.localhost:8080 for npmjs, right for a developer on the host), and npm
      # ranks a project .npmrc ABOVE ~/.npmrc — so a `cat > ~/.npmrc` preamble would be written and
      # silently ignored. `npm_config_*` environment outranks both files, so it wins without
      # touching the submodule's tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      # dist/qits-spa-ci/browser — the bundle the image build consumes (it is
      # quarkus.quinoa.build-dir in service/src/main/resources/application.properties), and the ONE
      # artifact this half exists to produce. Lint and test are qits-spa-ci's own pipeline's job;
      # repeating them here would only make this repo red for someone else's commit.
      npm run build
      cd -

      # THE CREDENTIAL IS A SECRET MOUNT AND NEVER A BUILD ARG — an arg is recorded in the image
      # history, and this image is pullable. The launcher injects the run's commissioned idp client
      # as $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; these two flags hand that
      # pair to the mounts on the Dockerfile's mvnw RUN, which is the only place it exists.
      # Unconditional on purpose: a missing env source is NOT an error — measured on buildx v0.36.1,
      # `--secret id=x,env=DOES_NOT_EXIST` builds green and the mounted variable is simply unset —
      # so these lines do nothing at all until a run carries the pair.
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-ci:$QITS_CI_SHA"
      docker build --network host \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.

  - image: qits/build-images/node-base:latest
    branches:
      - prefix: maintenance/
    timeout-seconds: 300
    script: |
      set -eu
      case "$QITS_CI_BRANCH" in
        maintenance/*) ;;
        *) echo "not a maintenance branch: $QITS_CI_BRANCH"; exit 1 ;;
      esac
      summary=$(git log -1 --format=%s)

      # AUTHORIZATION, and why this step grew one. The release door is machine-authenticated —
      # qits-workspaces runs with QITS_AUTH_MACHINE_REQUIRED=true — so the POST below with no
      # Authorization header is answered 401, and the step goes red with `release refused: HTTP
      # 401`. It did exactly that on every maintenance bump from the day machine auth was switched
      # on: this step predates the switch, nothing about the bump train changed, and because the
      # only leg that fails is the last one, each bump landed on its branch and quietly stayed
      # there — green build, no release, no announcement, nobody told.
      #
      # THE CREDENTIAL IS THIS RUN'S OWN, never a secret written down here. qits-ci commissions an
      # idp client per run and injects it as $QITS_COMMISSIONED_CLIENT_ID and
      # $QITS_COMMISSIONED_CLIENT_SECRET — the same pair an image step hands buildx as a --secret
      # mount, and the same pair qits-git-credential exchanges before a push over HTTP. It is
      # short-lived and revoked at teardown, which is what makes it the only credential a step
      # authored in a repository is allowed to hold.
      #
      # $QITS_GIT_AUTH_TOKEN_URL is the idp's token endpoint. The name says "git" because git's
      # helper was its first caller; the value is the plain token URL, and it is the only idp
      # address a step is given.
      #
      # THE AUDIENCE IS DERIVED, not spelled. A token is cut FOR one service and qits-workspaces
      # refuses one cut for anyone else, so the mint below has to name it — and the name is the
      # host of $QITS_WORKSPACES_URL, which is the service alias, which is what qits-workspaces
      # checks as QITS_AUTH_MACHINE_AUDIENCE. Deriving keeps this deployment out of this file, the
      # same rule $QITS_WORKSPACES_URL itself follows. $QITS_WORKSPACES_AUDIENCE is read first, so
      # a later launcher can state the audience outright without editing every repository carrying
      # this step.
      #
      # NO PAIR, NO HEADER. A deployment that commissions nothing has no pair to exchange and has
      # machine auth off as well, so there the call goes out unauthenticated exactly as it always
      # did, rather than the step dying on a mint it was never going to be able to make. A pair
      # that IS present and cannot be exchanged is the opposite case — a broken platform rather
      # than an unconfigured one — and that is red.
      node -e '
        const [url, branch, summary] = process.argv.slice(1);
        const env = process.env;

        // The bearer the door now demands. With no commissioned pair this resolves to no header at
        // all, which is precisely the call this step used to make.
        const authorize = async () => {
          const id = env.QITS_COMMISSIONED_CLIENT_ID;
          const secret = env.QITS_COMMISSIONED_CLIENT_SECRET;
          const tokenUrl = env.QITS_GIT_AUTH_TOKEN_URL;
          if (!id || !secret || !tokenUrl) return {};
          const audience = env.QITS_WORKSPACES_AUDIENCE || new URL(url).hostname;
          const basic = Buffer.from(id + ":" + secret).toString("base64");
          const res = await fetch(tokenUrl, {
            method: "POST",
            headers: {
              "content-type": "application/x-www-form-urlencoded",
              authorization: `Basic ${basic}`,
            },
            body: new URLSearchParams({ grant_type: "client_credentials", audience }),
          });
          const text = await res.text();
          if (!res.ok) {
            throw new Error(`idp refused the commissioned client for ${audience}: HTTP ${res.status} ${text}`);
          }
          const token = JSON.parse(text).access_token;
          if (!token) throw new Error(`idp returned no access_token for ${audience}`);
          return { authorization: `Bearer ${token}` };
        };

        authorize().then((auth) => fetch(url, {
          method: "POST",
          headers: { "content-type": "application/json", ...auth },
          body: JSON.stringify({ branch, summary }),
        })).then(async (res) => {
          const text = await res.text();
          let body = {};
          try { body = JSON.parse(text); } catch {}
          if (res.ok) {
            console.log(`released ${body.version} as ${body.commitSha} from ${body.branch}`);
            return;
          }
          if (res.status === 409 && body.reason === "ALREADY_INTEGRATED") {
            console.log(`${branch} is already released - nothing to do`);
            return;
          }
          console.error(`release refused: HTTP ${res.status} ${text}`);
          process.exit(1);
        }).catch((err) => {
          console.error(`release call failed: ${err.message}`);
          process.exit(1);
        });
      ' "$QITS_WORKSPACES_URL/workspaces/api/branches/release?projectId=$QITS_CI_PROJECT_ID&repositoryName=$QITS_CI_REPO_NAME" \
        "$QITS_CI_BRANCH" "$summary"
