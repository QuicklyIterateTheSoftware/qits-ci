# The pipeline qits-ci runs on every push to a tracked branch of this repository — which is this
# repository, so a green run here ends by replacing the process that ran it.
#
# One step, two halves, and the split between them is the whole point:
#
#   1. build the ci client (service/src/main/webui = the qits-spa-ci submodule) HERE, in the step
#      container, which sits on qits-net and can therefore reach the platform's own npm registry —
#      where @qits/ui-components lives and where nothing else can reach it from;
#   2. build this repo's docker/Dockerfile, whose builder stage packages that already-built bundle
#      and never runs an install.
#
# A RUN step inside a docker build reaches the public internet but reaches the platform registry by
# no address at all (not the qits-net alias, not localhost:8081, not host.docker.internal). That is
# why the halves are split, and it is why this step's image is node-docker-base rather than ci-base:
# it needs node, npm and git for half one and the docker CLI for half two. The same split, for the
# same reason, as qits-gateway's pipeline and every webui-carrying sibling's — they should keep
# matching.
#
# Half two publishes under the tag that is the whole contract with qits-cd —
# <registry>/<repository>/<this repo's name>:<sha>. The step's own container only drives the docker
# CLI; the build and the push happen in the host's daemon through the socket this step declares
# (docker: true). A failed push is a failed step is a FAILED run.
steps:
  - image: qits/build-images/node-docker-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed docker build is
      # swallowed: the push fails, `docker rmi || true` answers 0, the run reports SUCCESS, and cd
      # is told an image exists that does not (the exact shape of the qits-workspaces
      # IMAGE_MISSING incident). -u is load-bearing too: an unset registry variable must stop the
      # step, not quietly resolve the @qits scope against npmjs.org, where those packages do not
      # exist and never will.
      set -eu

      # The daemon's clone does not recurse, so initialise the Angular client explicitly.
      git submodule update --init --depth 1 service/src/main/webui

      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative. Same problem
      # and same fix as qits-gateway's pipeline; the recipe is maintained in qits-spa-home's own
      # pipeline and every copy of it should keep matching.
      #
      # npm pins a full resolved URL per package, and qits-spa-ci's lockfile is generated on the
      # deployment host, so every entry names localhost:8081 — an address that does not exist in this
      # container. `npm ci` fetches tarballs by that URL and never asks the configured registry for
      # them, so the environment below does not reach them: without this swap the install dies on a
      # connection that will never be answered. The paths are identical on both addresses, so
      # replacing the ORIGIN and keeping the path is all it takes, and the integrity hashes are what
      # make that safe — bytes from the other address must still hash the same. The checkout is this
      # step's own; nothing is edited that anyone will ever read again.
      #
      # npm's own knob for exactly this, `--replace-registry-host=always`, cannot do it against a
      # registry mounted under a path. @npmcli/arborist glues rather than resolves (reify.js:
      # `registry.slice(0, -1) + resolvedURL.pathname`), so
      # http://qits-artifacts:8080/artifacts/npm/npmjs/ + /artifacts/npm/npmjs/zone.js/-/…tgz comes
      # out as …/artifacts/npm/npmjs/artifacts/npm/npmjs/zone.js/-/…tgz and every tarball 404s.
      # Measured on npm 10.9.4.
      #
      # The origin is derived from the injected env rather than spelled here: no repository states a
      # deployment's addresses, and the one address qits-spa-ci does state (localhost:8081, in its
      # .npmrc, for a developer on the host) is the one being replaced.
      cd service/src/main/webui
      npm_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      sed -i -E "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_origin#" package-lock.json

      # ENVIRONMENT, not a file. qits-spa-ci COMMITS an .npmrc (localhost:8081, right for a developer
      # on the host), and npm ranks a project .npmrc ABOVE ~/.npmrc — so a `cat > ~/.npmrc` preamble
      # would be written and silently ignored. `npm_config_*` environment outranks both files, so it
      # wins without touching the submodule's tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      # dist/qits-spa-ci/browser — the bundle the image build consumes (it is
      # quarkus.quinoa.build-dir in service/src/main/resources/application.properties), and the ONE
      # artifact this half exists to produce. Lint and test are qits-spa-ci's own pipeline's job;
      # repeating them here would only make this repo red for someone else's commit.
      npm run build
      cd -

      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-ci:$QITS_CI_SHA"
      docker build --network qits-net \
        --build-arg QITS_MAVEN_REPOSITORY_URL=http://qits-artifacts:8080/artifacts/maven/maven \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      docker rmi "$ref" || true

  - image: qits/build-images/node-base:latest
    branches:
      - prefix: maintenance/
    timeout-seconds: 300
    script: |
      set -eu
      case "$QITS_CI_BRANCH" in
        maintenance/*) ;;
        *) echo "not a maintenance branch: $QITS_CI_BRANCH"; exit 1 ;;
      esac
      summary=$(git log -1 --format=%s)
      node -e '
        const [url, branch, summary] = process.argv.slice(1);
        fetch(url, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ branch, summary }),
        }).then(async (res) => {
          const text = await res.text();
          let body = {};
          try { body = JSON.parse(text); } catch {}
          if (res.ok) {
            console.log(`released ${body.version} as ${body.commitSha} from ${body.branch}`);
            return;
          }
          if (res.status === 409 && body.reason === "ALREADY_INTEGRATED") {
            console.log(`${branch} is already released - nothing to do`);
            return;
          }
          console.error(`release refused: HTTP ${res.status} ${text}`);
          process.exit(1);
        }).catch((err) => {
          console.error(`release call failed: ${err.message}`);
          process.exit(1);
        });
      ' "$QITS_WORKSPACES_URL/workspaces/api/branches/release?repositoryId=$QITS_CI_REPO_ID" \
        "$QITS_CI_BRANCH" "$summary"
