# How qits-platform-deployments deploys this repo. It reads this file from the git host at
# the built sha, so the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. qits-workspaces reads it on a release to
# decide whether this repository deploys — a library or an SPA carries none and its release is
# the trunk push alone — and then promotes onto the branch it is configured with
# (`qits.workspaces.release.entry-branch`). `deploy_branches` used to name that branch here, in
# thirteen copies of one platform-wide answer, and a release pushed onto every entry it named.
#
# ENVIRONMENT service: every environment runs its own instance, and a green build deploys into
# whichever tier listens to the built branch.
deployment_target: environment

# The path prefix the edge routes here on EVERY host, browser and machine alike. The client itself
# is served at `/` on this service's own host (ci.<env>.<domain>), so this covers the machine surface
# only: /ci/api, /ci/q and /ci/daemon.
routes: /ci

# Where this application appears in the chrome's navigation tree. `<slot>.<Label>:<position>`, and
# the slot is what places it: `<category>.details` is a child of a repository in scope, so CI shows
# up under every repository whatever kind it is — a library has runs exactly like a service does.
# Position 2 is per slot, and it is the platform's fixed order of the per-repository applications
# (Docs 1, CI 2, Artifacts 3, Configuration 4, Workspaces 5).
navigation-entries: services.details.CI:2, daemons.details.CI:2, libs.details.CI:2, frontends.details.CI:2, cli.details.CI:2, images.details.CI:2

# TWO DATABASES, because this deployable joins two jars that each own a store, and each one maps the
# generic contract in its own shipped defaults. qits-platform-deployments creates a role and a
# database per entry on the tier's postgres before the successor container starts, and injects
# QITS_RESOURCE_<NAME>_URL / _USERNAME / _PASSWORD. The NAMES are what the variable names follow, so
# they are not free: `db` is what the ci jar's microprofile-config.properties reads, `eventstream` is
# what the qits-eventstream jar's does, and renaming either here silently stops matching.
#
# `db` takes the derived default database — `qits_` + the application name minus its `qits-` prefix,
# so qits_ci — and says so by omitting the third segment. `eventstream` cannot: the default would be
# qits_ci too, and one database cannot be two stores with two Flyway lineages, so it is named. The
# name carries this repository, because every consumer of that jar declares a resource called
# `eventstream` and they must not collide on one postgres.
resources: postgresql:db, postgresql:eventstream:qits_ci_eventstream

# STOP-FIRST: one CI process at a time. A start-first successor swept while the predecessor was
# still claiming queued rows, and left a RUNNING run no worker owned (2026-08-23).
update_order: stop-first
