# Test-only overrides. This module is the deployable, so its app-level settings live in
# src/main/resources/application.properties and Quarkus MERGES that file into the test config — it is
# not shadowed by this one. Never re-declare an app-level setting here: a test copy that drifts from
# the shipped copy makes the suite lie, passing on a value no deployment ever gets.
#
# What belongs here is only what a test run genuinely needs to be different: the port, the embedded
# databases, a working directory under target/, and the stand-in for infrastructure this repo does
# not run.

# A FREE port, not Quarkus' default test port 8081. On the deployment host 8081 is the address the
# platform's own npm registry answers on — the address this repo's webui .npmrc names — so on the one
# machine this service is most likely to be built on, the default is already bound and the whole
# suite dies with "Port already bound: 8081", which reads like a code failure and is not one. Even
# where it is free, @QuarkusTest restarts race each other for it. Failsafe passes the same value to
# the packaged artifact (service/pom.xml).
quarkus.http.test-port=0

# BOTH datasources run against an EMBEDDED POSTGRES — real binaries, spawned as a child process by
# zonky, never a container. Their ports are chosen at run time, so no url/username/password is
# written here at all: EmbeddedPgConfigSource supplies six values at an ordinal above this file, one
# database per datasource. What is left here is what a file can say. clean-at-start wipes each schema
# between Quarkus restarts, which is what keeps a suite sharing one database across classes
# reproducible.
#
# The second lineage is the outbox's, and it needs a database even though the bus is DARK in %test:
# `qits.eventstream.enabled=false` stops publishing, sweeping and dialling, not the datasource —
# Quarkus opens the connection and migrates at boot regardless.
quarkus.flyway.ci.clean-at-start=true
quarkus.flyway.eventstream.clean-at-start=true
# No `locations` for either, for the reason at the top of this file: each list is shipped in its own
# jar's META-INF/microprofile-config.properties. A copy here would drift and the suite would migrate
# a different lineage than the deployment does.

# NOTHING SWEEPS THE EVENT LOG BEHIND A TEST. The three bus listeners consume durably now, so the
# eventstream jar runs a catch-up sweep at startup and every 30s: it pages qits-events from each
# consumer's watermark and offers what it finds to the listener. Against StubEventsServer — which
# scripts a canned list and ignores the cursor — a tick landing mid-test would adopt a daemon release
# or enqueue a trigger evaluation the test did not ask for. This is the same pair the eventstream
# suite sets, and for the same reason; a test that wants a sweep calls CatchupSweeper.catchUp()
# itself. The interval is stretched rather than turning the scheduler off, because the OUTBOX sweeper
# is scheduled too and has no business being disabled here.
qits.eventstream.catchup-at-startup=false
qits.eventstream.catchup-interval=PT24H

# NO DEV SERVICES. This repo's first rule is that a clone builds and tests green with no docker, and
# a dev service is a container start: quarkus-oidc launches a real Keycloak whenever a profile leaves
# quarkus.oidc.auth-server-url unset, and a datasource whose url arrives from a config source rather
# than a file is exactly the shape that invites one if anything ever goes wrong with that source.
quarkus.devservices.enabled=false

# API queue/race tests deliberately occupy the sole worker to make QUEUED observable deterministically.
qits.ci.concurrent-builds=1

# The git host stand-in for every suite that does not stand one up: an address nothing answers, so
# a config read fails fast and lands as "the git host could not be reached" — which is what those
# suites' repositories are, and it beats a value that quietly looks reachable. A suite that really
# reads config declares StubGitHost (githost/StubGitHost), a real server on a real socket serving
# qits-githost's content routes out of bares under target/ci-svc-test-git-host; it hands Quarkus
# the port before boot, which is the only way an ephemeral port can reach this config.
#
# No path segment: the git host is its own service now and serves /git/** at the root, so a base
# carrying one would be a shape nothing answers.
qits.ci.git-host-url=http://127.0.0.1:1

# The orchestrator stand-in, and it stands nothing up: an address nothing answers on, exactly like
# the git host above. Every suite here is orchestrator-free by intent — the boot reap skips test
# mode, no @QuarkusTest launches a step container, and a test that really wants one scripts a
# StubContainersServer (daemonhost/StubContainersServer) and points a launcher at it by hand. What
# this line buys is that a NEW test which forgets to do that fails fast against nothing, rather than
# reaching a real qits-containers on the developer's own machine and deleting another process's
# containers.
qits.containers.url=http://127.0.0.1:1

# The read seams' patience deadline, same as the ci module's suite sets: 15S ships as the
# @ConfigProperty default and CiReadPatienceTest's give-up case must not wait out a postgres
# cutover. Not an app-level setting being shadowed — there is no line for it in
# src/main/resources/application.properties, and there must not be.
qits.ci.db-retry-deadline=PT0.3S

# Platform pipelines OFF in this suite: the shipped default names the wrapper, which no stub git
# host here serves, so leaving it on would cost every event a WARN about a repository that was never
# going to be there. The engine's own platform cases are the ci module's.
qits.ci.platform-pipelines-repository=

# THE USERFLOWS CLASS ORDERER, INSTALLED THE ONE WAY QUARKUS PERMITS. quarkus-junit ships its own
# junit-platform.properties with a ClassOrderer that groups tests by @TestProfile (so a profile's
# application is not torn down under a class still running), and surefire HARD-FAILS if a local
# junit-platform.properties overrides it. The blessed seam is the SECONDARY orderer, which breaks
# ties INSIDE a profile group — story classes sharing a profile still run in topological
# @UserflowPrecondition order, and every ordinary test class here (none carries a story annotation)
# is untouched. TokenValidationBootstrapIT is this repo's only userflow today and would need no
# ordering at all; the line is what makes the second one work without a discovery.
# The framework's registries are per-JVM: keep the single sequential test JVM (surefire/failsafe
# default forkCount=1) and do not enable parallel execution.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer

# NOTHING SWEEPS THE OWED-EVENT LEDGER BEHIND A TEST EITHER — the ci module's suite says why, and the
# same reasoning applies one module up: the trigger engine's periodic re-evaluation would fan out at
# StubGitHost for events another class is still arranging. The boot sweep is skipped under TEST by
# the observer itself.
qits.ci.trigger-owed-sweep-interval=24h
