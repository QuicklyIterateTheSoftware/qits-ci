# Test-only overrides. This module is the deployable, so its app-level settings live in
# src/main/resources/application.properties and Quarkus MERGES that file into the test config — it is
# not shadowed by this one. Never re-declare an app-level setting here: a test copy that drifts from
# the shipped copy makes the suite lie, passing on a value no deployment ever gets.
#
# What belongs here is only what a test run genuinely needs to be different: the in-memory database,
# a working directory under target/, and the stand-in for infrastructure this repo does not run.

# The service suite runs against in-memory H2 (no docker), overriding the file-H2 default shipped in
# the ci jar's META-INF/microprofile-config.properties. clean-at-start wipes between runs.
quarkus.datasource.ci.db-kind=h2
quarkus.datasource.ci.jdbc.url=jdbc:h2:mem:ci-svc;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.ci.datasource=ci
quarkus.hibernate-orm.ci.packages=eu.wohlben.qits.ci.entity
quarkus.flyway.ci.migrate-at-start=true
quarkus.flyway.ci.clean-at-start=true
quarkus.flyway.ci.locations=classpath:db/ci/migration

# ci's per-repo bare caches go under target/, never the real ~/.qits the jar default points at.
qits.ci.data-dir=target/ci-svc-test-data

# The same three lines again for the outbox's datasource, shipped file-H2 in the qits-eventsourcing
# jar's own META-INF/microprofile-config.properties. It is needed even though the bus is DARK in
# %test: `qits.eventsourcing.enabled=false` stops publishing, sweeping and dialling, not the
# datasource — Quarkus opens the connection and runs Flyway at boot regardless, so without this the
# suite would create and migrate a real ~/.qits/data/eventsourcing, and two builds on one host would
# race for its single-writer file. Test-only, exactly like the `ci` block above: the shipped value is
# the deployment's and is not restated in src/main.
quarkus.datasource.eventsourcing.db-kind=h2
quarkus.datasource.eventsourcing.jdbc.url=jdbc:h2:mem:eventsourcing-svc;DB_CLOSE_DELAY=-1
quarkus.flyway.eventsourcing.clean-at-start=true

# The git host stand-in. In production this is the smart-HTTP base of qits-artifacts' git host; the
# suite points it at a local directory laid out as <base>/git/<repoId> and addressed over file://,
# which is the same fetch-a-ref-then-check-reachability mechanics (the ci module's
# GitConfigFetcherTest uses the identical stand-in). ${user.dir} is the module basedir in a surefire
# fork, and file:// needs an absolute path.
qits.ci.git-host-url=file://${user.dir}/target/ci-svc-test-git-host
