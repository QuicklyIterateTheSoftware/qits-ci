# The application config for qits-ci as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# a context ships DEFAULTS it does not own the deployment of. The `ci` module's own defaults (its
# datasource, Flyway lineage, sandbox caps, token) stay there; a deployment still overrides any of
# them by env.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite carried
# a private copy in src/test/resources and the packaged app had none.

quarkus.application.name=qits-ci

# The prefix every route of this service lives under: /<segment>/api, where the segment is the
# service name without the qits- prefix. qits-gateway routes VERBATIM by prefix — /ci/* reaches
# qits-ci with the path untouched — so the service itself has to serve /ci/..., and there is no
# unprefixed form. This holds for service-to-service calls on qits-net too; they do not pass
# through the gateway but they address the same paths.
#
# Without it the intake moves to /events/post-receive and qits-artifacts' CiPostReceiveNotifier —
# which POSTs to a configured qits.ci.intake-url and swallows delivery failures at debug — silently
# stops delivering. Nothing errors; CI simply never runs. The suite inherits this file rather than
# keeping its own copy, so a test run cannot be green about a prefix that never ships.
quarkus.rest.path=/ci/api

# Quarkus' non-application root — what the framework serves rather than application code. It sits
# OUTSIDE quarkus.rest.path, so it has to carry the segment on its own or it stays at / and is
# unreachable through the gateway.
quarkus.http.non-application-root-path=/ci/q

# --- what goes on the wire ------------------------------------------------------------------------
# Compress responses. MEASURED before this key existed: one poll of GET /ci/api/runs/{runId} for a
# real multi-step run shipped 37 KiB with `Content-Encoding: identity`, and the run page re-reads
# that resource every three seconds for as long as the run is RUNNING. The read has no delta and no
# offset — every poll re-sends the full `output` of every completed step, each bounded at
# `qits.ci.output-max-chars=65536` — so the payload is step output, which is text, which is exactly
# what compresses. It costs one key and it is the only lever on this side; the server-side output
# offset that would make the resource small is still the named fast-follow, not a reason to ship the
# bytes uncompressed in the meantime.
#
# This is BUILD_AND_RUN_TIME_FIXED, so it has to be here rather than in a deployment's environment:
# QUARKUS_HTTP_ENABLE_COMPRESSION on a built artifact does nothing at all, quietly.
#
# quarkus.http.compress-media-types is deliberately LEFT UNSET. Quarkus 3.34.6's default list is
# text/html, text/plain, text/xml, text/css, text/javascript, application/javascript,
# application/json, application/graphql+json and application/xhtml+xml — read out of the extension's
# own config model, not remembered — which already covers both surfaces this service serves: the JSON
# API and the Angular client's html, css and javascript. Setting the key REPLACES that list rather
# than extending it, the same trap as ignored-path-prefixes above, so it is worth setting only for a
# media type genuinely outside it, and then the whole list must be spelled out again.
#
# Nothing is compressed for a client that did not ask: Vert.x negotiates on Accept-Encoding, so a
# caller sending none — every service-to-service caller here — gets the same identity bytes as
# before. Decompression of REQUEST bodies stays off; the only bodies arriving here are small intake
# POSTs, and enabling it would add an inflation path to a token-free surface for no gain.
quarkus.http.enable-compression=true

# --- the API document -------------------------------------------------------------------------
# Served at /ci/q/openapi, with the browsable UI at /ci/q/swagger-ui — both follow
# quarkus.http.non-application-root-path above (quarkus.swagger-ui.path is relative by default, so
# it moves along; do not pin it). always-include because swagger-ui is a dev-mode-only extension by
# default, and the point of packaging these as processes is that each documents its own surface in
# a real deployment.
quarkus.smallrye-openapi.info-title=qits-ci API
quarkus.swagger-ui.always-include=true

# --- the Angular client -------------------------------------------------------------------------
# Quinoa builds the `qits-spa-ci` submodule at service/src/main/webui — Quinoa's default
# `web-ui-dir` — and serves the result from the packaged artifact. A fresh clone therefore needs
# `git submodule update --init` before `./mvnw package`; without it Quinoa finds no package.json,
# quietly does nothing, and the app ships with no client.
#
# The SPA sits at /ci, the same segment as everything else here, for the same reason: qits-gateway
# routes VERBATIM by prefix, so /ci/* reaches this service with the path untouched and there is no
# unprefixed form to fall back on. The segment is spelled a THIRD time in the client itself — the
# Angular baseHref in its angular.json is /ci/ — because the browser resolves asset urls against the
# document, not against anything the server knows. Move this and move that.
quarkus.quinoa.ui-root-path=/ci

# Deep links (/ci/runs/<id>) are the client's routes, not this service's, so anything under /ci that
# is not a built file is re-routed to index.html and Angular's router takes it from there. The
# fallback route is registered near-last, so it only ever sees what no earlier route took.
quarkus.quinoa.enable-spa-routing=true

# --- what the SPA fallback must NOT swallow -------------------------------------------------------
# The platform-wide rule, and the reason this service has to spell the key out:
#
#   LEAVE IT UNSET when quarkus.rest.path and quarkus.http.non-application-root-path already name the
#   service's WHOLE machine surface. Quinoa derives the ignore list from exactly those two keys, so
#   the list and the paths cannot drift, and that is strictly better than a copy.
#
#   SET IT when literal machine paths exist OUTSIDE that derivation — which is this service. The
#   ci-daemon control socket is `@WebSocket(path = "/ci/daemon")`, a literal that carries the /ci
#   segment itself and follows neither key (AGENTS.md, "The ci-daemon control plane").
#
# This file used to argue the socket was safe unset, because websockets-next registers its route at
# the default order while Quinoa's SPA route is near-last. That covers the UPGRADE and nothing else.
# MEASURED on the packaged fast-jar before this key existed: a plain GET (no Upgrade header) of
# /ci/daemon and /ci/daemon/nope each answered 200 text/html with the SPA's index.html — the socket
# route never claimed them and the fallback did. /ci/daemon is a cross-repo machine contract (the
# ci-daemon in every step container dials $QITS_CI_DAEMON_URL), and a machine client handed a web
# page parses it as data. The correct answer to a mistyped machine path is 404.
#
# Setting this key REPLACES the derivation rather than extending it, which is why /api and /q are
# spelled out again by hand. Drop either and the API starts answering mistyped paths with index.html.
#
# The values are RELATIVE: Quinoa strips ui-root-path before matching, so it is /api and never
# /ci/api. An absolute value matches nothing and fails exactly like an unset key — the failure that
# hides.
#
# The list moves when any of its three sources moves: quarkus.rest.path,
# quarkus.http.non-application-root-path, or the @WebSocket literal in CiDaemonSocket. Add a literal
# route, add its prefix here in the same commit.
#
# Ignoring a prefix stops the SPA REROUTE; it does not unregister a route. The websocket upgrade on
# /ci/daemon still works, and CiPackagedSurfaceIT proves it on the packaged artifact.
quarkus.quinoa.ignored-path-prefixes=/api,/q,/daemon

# Where `ng build` leaves its output, relative to the ui dir. Quinoa's Angular detection derives the
# same value from angular.json (no `outputPath` set, so `dist/<project>/browser`), but it is spelled
# out because it is a coupling to the client's PROJECT NAME rather than to its repo name — a rename
# inside angular.json would otherwise make Quinoa package an empty client with nothing to say so.
quarkus.quinoa.build-dir=dist/qits-spa-ci/browser

# --- what a deployment MUST override -----------------------------------------------------------
# Deliberately NOT pinned here, because any value this repo picks would be wrong and wrong quietly:
#
#   qits.ci.git-host-url       Where the git host answers, and where ci reads pipeline config from.
#                              ci appends /git/<repoId> itself, so this value ends at the SERVICE,
#                              not at /git: qits-artifacts serves its git host under its gateway
#                              segment, so the shape is http://<host>:<port>/artifacts and a read
#                              lands on /artifacts/git/<repoId>. Its default,
#                              http://localhost:${quarkus.http.port:8080}/artifacts, meant "qits
#                              itself" when ci ran in-process; standalone that address is now THIS
#                              service, which hosts no git. Left at the default a config read 404s
#                              and every run reports "no pipeline" rather than an error. Point it at
#                              qits-artifacts on qits-net.
#
#   qits.ci.container-git-url  The same base, with the same /artifacts shape, as reachable from
#                              inside a step container. Its host.docker.internal default assumes
#                              host-run docker; on qits-net it must be the qits-artifacts alias.

# --- machine identity ----------------------------------------------------------------------------
# The other identity track (qits-integrations-quarkus/README.md). Users arrive through the gateway as
# a header; MACHINES arrive as a bearer token minted by qits-platform-idp, and this is where this
# service says which tokens are its own.
#
# `qits-ci` is this service's id at the idp: the `aud` its tokens carry, and its own client id when
# it asks for one. Set here rather than left to a deployment because it is not a deployment fact — a
# service that accepted tokens addressed elsewhere would be broken, not configured differently.
qits.auth.machine.audience=qits-ci

# The rollout gate stays at its shipped default of FALSE and is not spelled here. Off, every guard in
# the code returns at once and the endpoints behave exactly as they did before qits-platform-idp
# existed — network trust, no bearer needed. A deployment turns it on with
# QITS_AUTH_MACHINE_REQUIRED=true, one service at a time, once the idp is reachable and its client
# has a secret.
#
# Bearer VALIDATION follows that gate rather than standing on its own, which is what lets this
# service ship its enforcement code first: with the gate off there is no OIDC tenant, so nothing
# fetches a JWKS, nothing waits on a host named qits-platform-idp, and a clone-alone `./mvnw verify`
# needs no issuer at all. There is no third state — either the gate and the validation are both on,
# or both off. Same shape in qits-cd and qits-artifacts.
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}

# Everything below describes the tenant when it exists. Bearer-only: this service starts no login
# flow and holds no session — a request with no Authorization header is not challenged, it falls
# through to forward-auth and stays user traffic.
quarkus.oidc.auth-server-url=http://qits-platform-idp:8080/idp
quarkus.oidc.application-type=service

# Discovery OFF, and the JWKS path given instead. The issuer string is the idp's public URL while
# this fetch goes direct on qits-net, so the two do not agree and a discovery document read from the
# internal address would carry the wrong issuer. The path is joined onto auth-server-url, which is
# why it is `jwks` and not `/idp/jwks`. Set quarkus.oidc.token.issuer once the two diverge — they do
# the day the idp serves users at a public URL and services keep fetching direct.
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=jwks

# Spelled from the key above rather than repeated: this is the same statement — "tokens for qits-ci"
# — made once to quarkus-oidc and once to qits-auth-core, and a drift between them would accept a
# token the guards then refuse.
quarkus.oidc.token.audience=${qits.auth.machine.audience}

# Retry the boot-time JWKS fetch rather than falling straight back to lazy. Without this there is
# ONE attempt: it fails to a WARN ("an attempt to connect will be made during the first request"),
# and the first request carrying a bearer pays for it — a 500 if the issuer is still unreachable.
# On a cold boot this service races idp's own start and loses; the SCMRelease trigger the bootstrap
# sends is exactly such a request, and it 500'd for that reason. 30S is fifteen tries, two seconds
# apart, which covers idp coming up beside this service in the same compose.
#
# NOT a hard dependency: when the window expires the same WARN is logged and startup continues. And
# readiness deliberately stays independent of the issuer — quarkus.oidc.health.enabled is BUILD_TIME
# and cannot follow the runtime gate above, so enabling it would report every gate-off deployment
# NOT READY for good.
quarkus.oidc.connection-delay=30S

# --- announcing green runs: there is no key here any more -----------------------------------------
# A green run used to be announced TWICE: a BuildSuccessful event on the bus, and a direct POST to
# qits-platform-deployments' HTTP intake at qits.platform.deployments.intake-url, carrying a
# qits-idp bearer this service asked quarkus-oidc-client for. Both that key and the whole
# quarkus.oidc-client.* block are gone, along with notify/PdBuildNotifier, notify/PdBearer and the
# ci/control/PdNotifier port.
#
# What replaced them is one pair, and it is durable where the POST was fire-and-forget:
# qits-ci publishes BuildSuccessful through the eventstream outbox (so an unreachable qits-events
# delays the event rather than losing it), and qits-platform-deployments consumes it with a durable
# subscriber that calls its own announce path (so a disconnected or restarting deployer catches up
# from the log). The measured loss this closes is a whole class rather than one incident: a refusal
# window during an idp cutover used to cost a deployment silently, and the bounded retries added in
# answer to that only narrowed the window.
#
# The deployer's intake still exists and still takes a POST. It is the manual and recovery door — a
# bootstrap replay knocks on it by hand — but nothing in qits-ci calls it, so nothing here
# configures it. So there is no address of the deployer in this file at all, and a deployment
# without one is a deployment where nobody subscribes.
#
# Outbound identity went with it: this service now presents a credential to nobody. The inbound gate
# (qits.auth.machine.required, above) is untouched and stays independent, which it always was.

# --- the packaged artifact -----------------------------------------------------------------------
# Name the build output `qits-ci` rather than qits-ci-service-<version>-runner, so `-Dnative`
# produces target/qits-ci and the process is identifiable in `ps` — which matters more here than
# elsewhere, because this service's own work is spawning `docker run` children and a step's process
# tree is read while debugging a run. The name is spelled TWICE: here, and as failsafe's
# native.image.path in service/pom.xml. They move together — if they drift, the native IT launches
# nothing and passes.
quarkus.package.output-name=qits-ci
quarkus.package.jar.add-runner-suffix=false

# --- telemetry --------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path, the same
# shape as qits.projects.url. The ingest path is qits-observability's own and belongs to the
# service, not to the deployment, so it is spelled once here and derived rather than configured.
# Point this at a collector or a different host and everything below follows.
qits.observability.url=http://qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is OtelReceiverResource over HTTP, and the
# exporter appends /v1/<signal> to this base — so this resolves to the three ingest routes at
# /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# That an ordinary logger call really becomes an exported OTLP record is proven once, in qits-events:
# its OtelLogBridgeTest decodes a real ExportLogsServiceRequest and PackagedLogBridgeIT repeats the
# claim against the packaged artifact. The same extension and the same four keys run here, so this
# repo guards the configuration rather than re-proving the behaviour — OtelLogConfigTest pins these
# values so drift cannot disable log export quietly.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# --- the platform event bus ---------------------------------------------------------------------
# This service publishes `BuildSuccessful` to qits-events when a run goes green, and listens for it
# again off the same bus (bus/BuildSuccessfulAnnouncer and bus/BuildSuccessfulListener; the machinery
# is the published qits-eventstream jar).
#
# NOTHING THE BUS NEEDS IS SPELLED HERE, deliberately. `qits.events.url`, the outbox's own datasource
# and Flyway lineage, the publish timeout, the retry budget and the redial backoff all ship as
# defaults in that jar's META-INF/microprofile-config.properties at ordinal 100 — the same way `ci`
# ships its own — and a copy in this file would be a second place to change and a silent way for the
# two to drift. A deployment overrides them by env, unchanged by anything here:
# `QITS_EVENTS_URL` and `QUARKUS_DATASOURCE_EVENTSTREAM_JDBC_URL` (the outbox must live on the data
# volume, not in the container's ~/.qits).
#
# What DOES belong here is the darkness, because the library ships enabled — a library that shipped
# dark would be one whose first deployment discovers it was never wired up — and the deployable is
# what owns where it is real. Same policy and same reasoning as the OTel keys above: a clone-alone
# `./mvnw verify` and a `quarkus:dev` have no qits-events on the far side, and enabled, every green
# run would pay the publish timeout dialling an unresolvable host, leave an outbox row behind and
# have the sweeper retry it, while the subscriber redialled a stream nobody serves. Off means
# publish() is a debug line, the sweeper does nothing and no stream is dialled — there is no
# half-enabled state.
#
# A test that wants the bus turns it back on for itself against an in-test stub server
# (`BuildSuccessfulPublishTest`), never against a real qits-events.
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false

# The daemon pin ladder's startup discovery (ci-daemon-autoadopt-plan.md §2.9) is a separate HTTP
# call to qits.events.url and is not covered by the key above, so it gets its own switch, dark for
# the same reason: a clone-alone `./mvnw verify` and a `quarkus:dev` have no qits-events to dial.
%dev.qits.ci.daemon-autoadopt-enabled=false
%test.qits.ci.daemon-autoadopt-enabled=false
