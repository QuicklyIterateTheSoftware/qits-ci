# The application config for qits-ci as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# a context ships DEFAULTS it does not own the deployment of. The `ci` module's own defaults (its
# datasource, Flyway lineage, sandbox caps, token) stay there; a deployment still overrides any of
# them by env.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite carried
# a private copy in src/test/resources and the packaged app had none.

quarkus.application.name=qits-ci

# The JAX-RS prefix every qits route lives under. Without it the intake moves to
# /ci/events/post-receive and qits-artifacts' CiPostReceiveNotifier — which POSTs to a configured
# qits.ci.intake-url — silently stops delivering. The suite sets its own copy, so a test run stays
# green either way, which is exactly why this needs to be here and not only there.
quarkus.rest.path=/api

# --- the API document -------------------------------------------------------------------------
# Served at /q/openapi, with the browsable UI at /q/swagger-ui — both outside quarkus.rest.path.
# always-include because swagger-ui is a dev-mode-only extension by default, and the point of
# packaging these as processes is that each documents its own surface in a real deployment.
quarkus.smallrye-openapi.info-title=qits-ci API
quarkus.swagger-ui.always-include=true

# --- what a deployment MUST override -----------------------------------------------------------
# Deliberately NOT pinned here, because any value this repo picks would be wrong and wrong quietly:
#
#   qits.ci.git-host-url       The smart-HTTP base ci fetches pipeline config from. Its default,
#                              http://localhost:${quarkus.http.port:8080}, meant "qits itself" when
#                              ci ran in-process. Standalone that address is now THIS service, which
#                              hosts no git — the git host is qits-artifacts. Left at the default a
#                              config fetch 404s and every run reports "no pipeline" rather than an
#                              error. Point it at qits-artifacts on qits-net.
#
#   qits.ci.container-git-url  The same base as reachable from inside a step container. Its
#                              host.docker.internal default assumes host-run docker; on qits-net it
#                              must be the qits-artifacts alias.
#
#   qits.ci.token              Blank means the event intake is unauthenticated. That is the dev
#                              default and stays a no-op guard until a deployment sets it. Note the
#                              intake triggers repo-controlled code in a sandboxed container.
